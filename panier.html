<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Votre Panier - Stef.Sewing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Nunito", sans-serif;
        background-color: #faedcb;
        background-image:
          radial-gradient(
            at 0% 0%,
            rgba(212, 163, 115, 0.15) 0px,
            transparent 50%
          ),
          radial-gradient(
            at 100% 0%,
            rgba(109, 138, 104, 0.15) 0px,
            transparent 50%
          );
        background-attachment: fixed;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      h1,
      h2,
      h3,
      .font-round {
        font-family: "Poppins", sans-serif;
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.6);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.8);
        box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.1);
      }
    </style>
  </head>
  <body
    class="text-gray-800 antialiased selection:bg-[#D4A373] selection:text-white"
  >
    <header
      class="sticky top-0 z-50 bg-white/70 backdrop-blur-lg border-b border-white/50 shadow-sm"
    >
      <div
        class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between"
      >
        <div class="flex items-center gap-3">
          <a href="index.html" class="flex items-center gap-2 group">
            <div
              class="w-10 h-10 bg-[#6D8A68] rounded-full flex items-center justify-center text-white font-bold text-xl group-hover:scale-105 transition transform shadow-md"
            >
              S
            </div>
            <span
              class="text-2xl font-bold text-gray-800 tracking-tight font-round"
              >Stef<span class="text-[#D4A373]">.</span>Sewing</span
            >
          </a>
        </div>
        <nav class="hidden md:flex gap-8">
          <a
            href="index.html"
            class="text-gray-600 hover:text-[#6D8A68] font-bold transition"
            >Accueil</a
          >
          <a
            href="boutique.html"
            class="text-gray-600 hover:text-[#6D8A68] font-bold transition"
            >Boutique</a
          >
        </nav>
        <div class="flex items-center gap-4">
          <a
            href="index.html"
            class="text-sm font-bold text-gray-500 hover:text-gray-800 transition"
            >Retour à la boutique</a
          >
        </div>
      </div>
    </header>

    <main class="flex-grow py-12 px-4 sm:px-6 max-w-5xl mx-auto w-full">
      <h1 class="text-4xl font-bold text-gray-800 font-round mb-8 text-center">
        Votre Panier
      </h1>

      <div id="cart-page-content" class="grid md:grid-cols-3 gap-8">
        <div class="md:col-span-2 space-y-4" id="cart-page-items">
          <!-- Items will be injected here -->
        </div>

        <div class="md:col-span-1">
          <div class="glass-card rounded-2xl p-6 sticky top-28">
            <h2 class="text-xl font-bold text-gray-800 mb-6 font-round">
              Résumé de la commande
            </h2>

            <div class="space-y-4 mb-6 text-gray-600 font-medium">
              <div class="flex justify-between">
                <span>Sous-total</span>
                <span id="cart-page-subtotal">0.00€</span>
              </div>
              <div class="flex justify-between">
                <span>Frais de port</span>
                <span class="text-[#6D8A68]">Gratuit</span>
              </div>
            </div>

            <div class="border-t border-gray-200 pt-4 mb-8">
              <div
                class="flex justify-between items-center text-lg font-bold text-gray-800"
              >
                <span>Total</span>
                <span id="cart-page-total">0.00€</span>
              </div>
            </div>

            <a
              href="paiement.html"
              id="checkout-btn"
              class="block w-full text-center bg-[#D4A373] text-white font-bold py-3 rounded-xl hover:bg-[#b88c61] transition shadow-md"
            >
              Valider la commande
            </a>
          </div>
        </div>
      </div>
    </main>

    <footer
      class="mt-auto bg-white/60 backdrop-blur-md pt-12 pb-8 border-t border-white text-center shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.05)]"
    >
      <h2 class="text-2xl font-bold text-[#6D8A68] mb-3 font-round">
        Stef.Sewing
      </h2>
      <p class="text-gray-600 mb-6 text-sm font-medium">
        Sacs uniques & éco-responsables issus de l'upcycling.
      </p>
      <p class="text-xs text-gray-400">
        &copy; 2026 Stef.Sewing. Tous droits réservés.
      </p>
    </footer>

    <script src="cart.js"></script>
    <script>
      function renderCartPage() {
        const cart = getCart();
        const itemsContainer = document.getElementById("cart-page-items");
        const subtotalEl = document.getElementById("cart-page-subtotal");
        const totalEl = document.getElementById("cart-page-total");
        const checkoutBtn = document.getElementById("checkout-btn");

        if (cart.length === 0) {
          itemsContainer.innerHTML = `
                    <div class="glass-card rounded-2xl p-12 text-center">
                        <div class="text-6xl mb-4">🛒</div>
                        <h2 class="text-2xl font-bold text-gray-800 mb-4 font-round">Votre panier est vide</h2>
                        <p class="text-gray-600 mb-8">Vous n'avez pas encore ajouté d'articles à votre panier.</p>
                        <a href="boutique.html" class="inline-block bg-[#6D8A68] text-white font-bold py-3 px-8 rounded-full hover:bg-[#5a7356] transition shadow-md">Découvrir nos créations</a>
                    </div>
                `;
          subtotalEl.innerText = "0.00€";
          totalEl.innerText = "0.00€";
          checkoutBtn.classList.add(
            "opacity-50",
            "cursor-not-allowed",
            "pointer-events-none",
          );
          return;
        }

        checkoutBtn.classList.remove(
          "opacity-50",
          "cursor-not-allowed",
          "pointer-events-none",
        );

        itemsContainer.innerHTML = cart
          .map(
            (item) => `
                <div class="glass-card rounded-2xl p-4 flex flex-col sm:flex-row items-center gap-6">
                    <img src="${item.imageUrl}" alt="${item.name}" class="w-24 h-24 sm:w-32 sm:h-32 object-cover rounded-xl shadow-sm">

                    <div class="flex-1 text-center sm:text-left">
                        <h3 class="text-lg font-bold text-gray-800 mb-1">${item.name}</h3>
                        <p class="text-[#D4A373] font-bold text-xl">${item.price.toFixed(2)}€</p>
                    </div>

                    <div class="flex items-center gap-4">
                        <div class="flex items-center bg-white rounded-full border border-gray-200 shadow-sm overflow-hidden">
                            <button onclick="updateCartQuantity('${item.sku}', -1)" class="w-8 h-8 flex items-center justify-center text-gray-500 hover:bg-gray-100 hover:text-gray-800 transition font-bold">-</button>
                            <span class="w-8 text-center font-bold text-gray-800">${item.quantity}</span>
                            <button onclick="updateCartQuantity('${item.sku}', 1)" class="w-8 h-8 flex items-center justify-center text-gray-500 hover:bg-gray-100 hover:text-gray-800 transition font-bold">+</button>
                        </div>
                        <button onclick="removeFromCart('${item.sku}')" class="text-gray-400 hover:text-red-500 p-2 rounded-full hover:bg-red-50 transition" title="Supprimer">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    </div>
                </div>
            `,
          )
          .join("");

        const total = cart.reduce(
          (sum, item) => sum + item.price * item.quantity,
          0,
        );
        subtotalEl.innerText = total.toFixed(2) + "€";
        totalEl.innerText = total.toFixed(2) + "€";
      }

      document.addEventListener("DOMContentLoaded", renderCartPage);
    </script>
  </body>
</html>
