    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #fdf8f5;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }
        h1, h2, h3, h4, h5, .font-round {
            font-family: 'Fredoka', sans-serif;
        }

        .bg-blobs {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1;
            overflow: hidden;
            background-color: #fcf9f5; /* more natural earth tone for eco-friendly */
            pointer-events: none;
        }

        .blob {
            position: absolute;
            animation: morph 8s ease-in-out infinite alternate;
            opacity: 0.25;
        }

        .blob-1 {
            top: -5%; left: -10%;
            width: 350px; height: 350px;
            background: linear-gradient(135deg, #A8C9A7, #E0EACD);
            animation-duration: 12s;
        }

        .blob-2 {
            bottom: -5%; right: -10%;
            width: 300px; height: 300px;
            background: linear-gradient(135deg, #D4A373, #FAEDCB);
            animation-delay: -2s;
            animation-duration: 10s;
        }

        .blob-3 {
            top: 30%; left: 40%;
            width: 250px; height: 250px;
            background: linear-gradient(135deg, #B5838D, #FFCDD2);
            animation-delay: -4s;
            animation-duration: 9s;
        }

        @keyframes morph {
            0% {
                border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
                transform: translate(0, 0) rotate(0deg) scale(1);
            }
            100% {
                border-radius: 60% 40% 30% 70% / 50% 60% 40% 50%;
                transform: translate(8vw, 8vh) rotate(25deg) scale(1.1);
            }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 1.5rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .glass-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -5px rgba(0, 0, 0, 0.04);
        }

        .img-rounded { border-radius: 1rem 1rem 0 0; }
        .btn-round { border-radius: 9999px; transition: all 0.3s ease; }

        .hide { display: none; }
        .fade-in { animation: fadeIn 0.5s ease-in-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>

    <script>
        // Filtering logic
        const catBtns = document.querySelectorAll('.cat-btn');
        const matBtns = document.querySelectorAll('.mat-btn');


        let currentCat = 'all';
        let currentMat = 'all';

        function applyFilters() {
            const products = document.querySelectorAll('.glass-card[data-category]');
            products.forEach(product => {
                const productCat = product.getAttribute('data-category');
                const productMat = product.getAttribute('data-material');

                const matchCat = currentCat === 'all' || productCat === currentCat;
                const matchMat = currentMat === 'all' || productMat === currentMat;

                if (matchCat && matchMat) {
                    product.classList.remove('hide');
                    product.style.animation = 'none';
                    product.offsetHeight; // trigger reflow
                    product.classList.add('fade-in');
                } else {
                    product.classList.add('hide');
                }
            });
        }

        catBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                catBtns.forEach(b => {
                    b.className = 'cat-btn btn-round px-5 py-2 font-bold bg-white text-gray-600 hover:bg-[#F2F6F1] hover:text-[#6D8A68] shadow-sm border border-gray-100';
                });
                btn.className = 'cat-btn active btn-round px-5 py-2 font-bold bg-[#6D8A68] text-white shadow-md';
                currentCat = btn.getAttribute('data-category');
                applyFilters();
            });
        });

        matBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                matBtns.forEach(b => {
                    b.className = 'mat-btn btn-round px-3 py-1 text-sm font-bold bg-white text-gray-600 hover:bg-[#FAEDCB] hover:text-[#D4A373] shadow-sm border border-gray-100';
                });
                btn.className = 'mat-btn active btn-round px-3 py-1 text-sm font-bold bg-[#D4A373] text-white shadow-sm';
                currentMat = btn.getAttribute('data-material');
                applyFilters();
            });
        });

        // Cart logic
        let cartItemCount = 0;
        let cartTotal = 0;
        window.addToCart = function(productName, price) {
            const countEl = document.getElementById('cart-count');
            cartItemCount++;
            cartTotal += price;
            countEl.innerText = cartItemCount;
            countEl.classList.add('scale-125');
            setTimeout(() => countEl.classList.remove('scale-125'), 200);

            const toast = document.createElement('div');
            toast.className = 'fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-5 py-3 rounded-full shadow-2xl z-50 fade-in text-sm font-bold flex items-center gap-2';
            toast.innerHTML = `<span>🛍️ Ajouté : ${productName}</span> <span class="bg-white text-gray-800 px-2 py-0.5 rounded-full text-xs">Total: ${cartTotal}€</span>`;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'all 0.5s ease';
                setTimeout(() => toast.remove(), 500);
            }, 2500);
        };

        // FAQ logic
        window.toggleFaq = function(id) {
            const el = document.getElementById(id);
            const iconId = id.replace('faq', 'icon');
            const iconEl = document.getElementById(iconId);
            if (el.classList.contains('hidden')) {
                el.classList.remove('hidden');
                el.classList.add('fade-in');
                iconEl.innerText = '-';
            } else {
                el.classList.add('hidden');
                iconEl.innerText = '+';
            }
        };
    </script>

<script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/10IpT17XUO5SXC30sqex9bQXr33P2h9mxloUwc-YCSCY/export?format=csv';

    function parseCSV(str) {
        const arr = [];
        let quote = false;
        for (let row = 0, col = 0, c = 0; c < str.length; c++) {
            let cc = str[c], nc = str[c+1];
            arr[row] = arr[row] || [];
            arr[row][col] = arr[row][col] || '';

            if (cc == '"' && quote && nc == '"') {
                arr[row][col] += cc; ++c; continue;
            }
            if (cc == '"') {
                quote = !quote; continue;
            }
            if (cc == ',' && !quote) {
                ++col; continue;
            }
            if (cc == '\r' && nc == '\n' && !quote) {
                ++row; col = 0; ++c; continue;
            }
            if (cc == '\n' && !quote) {
                ++row; col = 0; continue;
            }
            if (cc == '\r' && !quote) {
                ++row; col = 0; continue;
            }
            arr[row][col] += cc;
        }
        return arr;
    }

    </script>


<script>
    async function loadProductDetail() {
        const urlParams = new URLSearchParams(window.location.search);
        const sku = urlParams.get('sku');
        if (!sku) {
            document.getElementById('loading').innerText = 'Produit non trouvé.';
            return;
        }

        try {
            const response = await fetch(CSV_URL, { redirect: 'follow' });
            const text = await response.text();
            const data = parseCSV(text);
            const headers = data[0];
            const products = data.slice(1).map(row => {
                let obj = {};
                headers.forEach((h, i) => obj[h.trim()] = row[i]);
                return obj;
            });

            const product = products.find(p => p['Identifiant (SKU)'] === sku);

            if (product) {
                document.getElementById('loading').classList.add('hide');
                document.getElementById('product-container').classList.remove('hide');
                document.getElementById('product-container').classList.add('fade-in');

                document.getElementById('prod-img').src = product['imageUrl'];
                document.getElementById('prod-img').alt = product['Nom du produit'];
                document.getElementById('prod-cat').innerText = product['Catégorie'];
                document.getElementById('prod-name').innerText = product['Nom du produit'];
                document.getElementById('prod-desc').innerText = product['Description longue'] || product['Description courte'];
                document.getElementById('prod-price').innerText = product['Prix'] + '€';

                let prixVal = parseFloat((product['Prix'] || '0').replace(',','.'));
                let pName = product['Nom du produit'].replace(/'/g, "&#39;");

                document.getElementById('add-btn').onclick = function() {
                    if (typeof addToCart === 'function') {
                        addToCart(pName, prixVal);
                    }
                };
            } else {
                document.getElementById('loading').innerText = 'Produit non trouvé.';
            }
        } catch (e) {
            console.error(e);
            document.getElementById('loading').innerText = 'Erreur lors du chargement.';
        }
    }

    document.addEventListener('DOMContentLoaded', loadProductDetail);
</script>
