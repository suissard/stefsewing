    <style>
        html {
            scroll-behavior: smooth;
            scroll-padding-top: 7rem;
        }
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #fdf8f5;
            overflow-x: hidden;
        }
        h1, h2, h3, h4, h5, .font-round {
            font-family: 'Fredoka', sans-serif;
        }

        .bg-blobs {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1;
            overflow: hidden;
            background-color: #fcf9f5; /* more natural earth tone for eco-friendly */
            pointer-events: none;
        }

        .blob {
            position: absolute;
            animation: morph 8s ease-in-out infinite alternate;
            opacity: 0.25;
        }

        .blob-1 {
            top: -5%; left: -10%;
            width: 350px; height: 350px;
            background: linear-gradient(135deg, #A8C9A7, #E0EACD);
            animation-duration: 12s;
        }

        .blob-2 {
            bottom: -5%; right: -10%;
            width: 300px; height: 300px;
            background: linear-gradient(135deg, #D4A373, #FAEDCB);
            animation-delay: -2s;
            animation-duration: 10s;
        }

        .blob-3 {
            top: 30%; left: 40%;
            width: 250px; height: 250px;
            background: linear-gradient(135deg, #B5838D, #FFCDD2);
            animation-delay: -4s;
            animation-duration: 9s;
        }

        @keyframes morph {
            0% {
                border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
                transform: translate(0, 0) rotate(0deg) scale(1);
            }
            100% {
                border-radius: 60% 40% 30% 70% / 50% 60% 40% 50%;
                transform: translate(8vw, 8vh) rotate(25deg) scale(1.1);
            }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 1.5rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .glass-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -5px rgba(0, 0, 0, 0.04);
        }

        .img-rounded { border-radius: 1rem 1rem 0 0; }
        .btn-round { border-radius: 9999px; transition: all 0.3s ease; }

        .hide { display: none !important; }
        .fade-in { animation: fadeIn 0.5s ease-in-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s infinite;
            border-radius: 1rem;
        }
        @keyframes skeleton-loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

    </style>
</head>

    <script>
        // Filtering logic
        const catBtns = document.querySelectorAll('.cat-btn');
        const matBtns = document.querySelectorAll('.mat-btn');


        let currentCat = 'all';
        let currentMat = 'all';

        function applyFilters() {
            const products = document.querySelectorAll('.glass-card[data-category]');
            products.forEach(product => {
                const productCat = product.getAttribute('data-category');
                const productMat = product.getAttribute('data-material');

                const matchCat = currentCat === 'all' || productCat === currentCat;
                const matchMat = currentMat === 'all' || productMat === currentMat;

                if (matchCat && matchMat) {
                    product.classList.remove('hide');
                    product.style.animation = 'none';
                    product.offsetHeight; // trigger reflow
                    product.classList.add('fade-in');
                } else {
                    product.classList.add('hide');
                }
            });
        }

        catBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                catBtns.forEach(b => {
                    b.className = 'cat-btn btn-round px-5 py-2 font-bold bg-white text-gray-600 hover:bg-[#F2F6F1] hover:text-[#6D8A68] shadow-sm border border-gray-100';
                });
                btn.className = 'cat-btn active btn-round px-5 py-2 font-bold bg-[#6D8A68] text-white shadow-md';
                currentCat = btn.getAttribute('data-category');
                applyFilters();
            });
        });

        matBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                matBtns.forEach(b => {
                    b.className = 'mat-btn btn-round px-3 py-1 text-sm font-bold bg-white text-gray-600 hover:bg-[#FAEDCB] hover:text-[#D4A373] shadow-sm border border-gray-100';
                });
                btn.className = 'mat-btn active btn-round px-3 py-1 text-sm font-bold bg-[#D4A373] text-white shadow-sm';
                currentMat = btn.getAttribute('data-material');
                applyFilters();
            });
        });


        // FAQ logic
        window.toggleFaq = function(id) {
            const el = document.getElementById(id);
            const iconId = id.replace('faq', 'icon');
            const iconEl = document.getElementById(iconId);
            if (el.classList.contains('hidden')) {
                el.classList.remove('hidden');
                el.classList.add('fade-in');
                iconEl.innerText = '-';
            } else {
                el.classList.add('hidden');
                iconEl.innerText = '+';
            }
        };
    </script>

<script>
    let activeProduct = null;

    function handleAddProduct() {
        if (!activeProduct) return;
        const sku = activeProduct['Identifiant (SKU)'];
        let prixVal = parseFloat((activeProduct['Prix'] || '0').replace(',','.'));
        let pName = activeProduct['Nom du produit'].replace(/'/g, "&#39;");
        
        if (typeof addToCart === 'function') {
            addToCart(sku, pName, prixVal, activeProduct['imageUrl']);
            
            // Update badge immediately
            updateCartStatus(sku, true);

            // Temporary visual feedback on the button
            const addBtn = document.getElementById('add-btn');
            if (addBtn) {
                addBtn.innerText = "✓ Ajouté !";
                addBtn.className = "btn-round bg-[#6D8A68] text-white font-bold py-3 px-8 transition shadow-md w-full scale-105";
                addBtn.disabled = true;
            }

            setTimeout(() => {
                updateCartStatus(sku, false);
            }, 1200);
        }
    }

    function updateCartStatus(sku, skipButtonUpdate = false) {
        const container = document.getElementById('cart-status-container');
        if (!container) return;

        if (typeof getCart !== 'function') return;
        const cart = getCart();
        const item = cart.find(i => i.sku === sku);

        if (item) {
            container.innerHTML = `
                <div class="flex items-center gap-3 text-[#6D8A68] bg-[#F2F6F1] px-4 py-3 rounded-2xl border border-[#D1E2CF] font-semibold text-sm fade-in shadow-sm">
                    <div class="w-8 h-8 rounded-full bg-[#6D8A68] text-white flex items-center justify-center flex-shrink-0 shadow-sm">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path>
                        </svg>
                    </div>
                    <div>
                        <span class="text-gray-700">Cet article est dans votre panier</span>
                        <div class="text-xs text-gray-500 mt-0.5">Quantité : <strong class="text-[#6D8A68] font-bold text-sm">${item.quantity}</strong></div>
                    </div>
                </div>
            `;
            container.classList.remove('hide');
        } else {
            container.innerHTML = '';
            container.classList.add('hide');
        }

        if (!skipButtonUpdate) {
            const actionContainer = document.getElementById('action-container');
            if (actionContainer) {
                if (item) {
                    actionContainer.innerHTML = `
                        <div class="flex items-center gap-3 w-full fade-in">
                            <button onclick="updateCartQuantity('${sku}', -1)" class="w-12 h-12 flex items-center justify-center rounded-full bg-white hover:bg-gray-100 text-gray-600 border border-gray-200 shadow-sm transition font-bold text-xl" aria-label="Retirer 1">-</button>
                            <span class="flex-1 text-center font-bold text-[#6D8A68] bg-[#F2F6F1] border border-[#D1E2CF] rounded-full py-3 text-sm">
                                ${item.quantity} au panier
                            </span>
                            <button onclick="updateCartQuantity('${sku}', 1)" class="w-12 h-12 flex items-center justify-center rounded-full bg-[#6D8A68] hover:bg-[#5a7455] text-white shadow-md transition font-bold text-xl" aria-label="Ajouter 1">+</button>
                        </div>
                    `;
                } else {
                    actionContainer.innerHTML = `
                        <button id="add-btn" class="btn-round bg-[#D4A373] text-white font-bold py-3 px-8 hover:bg-[#b88c61] transition shadow-md w-full">
                            Ajouter au panier
                        </button>
                    `;
                    const btn = document.getElementById('add-btn');
                    if (btn) {
                        btn.onclick = handleAddProduct;
                    }
                }
            }
        }
    }

    async function loadProductDetail() {
        const urlParams = new URLSearchParams(window.location.search);
        const sku = urlParams.get('sku');
        if (!sku) {
            document.getElementById('loading').innerText = 'Produit non trouvé.';
            return;
        }

        try {
            const products = await fetchGoogleSheet('10IpT17XUO5SXC30sqex9bQXr33P2h9mxloUwc-YCSCY');

            const product = products.find(p => p['Identifiant (SKU)'] === sku);

            if (product) {
                activeProduct = product;
                
                document.getElementById('loading').classList.add('hide');
                document.getElementById('product-container').classList.remove('hide');
                document.getElementById('product-container').classList.add('fade-in');

                document.getElementById('prod-img').src = product['imageUrl'];
                document.getElementById('prod-img').alt = product['Nom du produit'];
                document.getElementById('prod-cat').innerText = product['Catégorie'];
                document.getElementById('prod-name').innerText = product['Nom du produit'];
                document.getElementById('prod-desc').innerText = product['Description longue'] || product['Description courte'];
                document.getElementById('prod-price').innerText = product['Prix'] + '€';

                // Initialize cart status badge and button style
                updateCartStatus(sku);
            } else {
                document.getElementById('loading').innerText = 'Produit non trouvé.';
            }
        } catch (e) {
            console.error(e);
            document.getElementById('loading').innerText = 'Erreur lors du chargement.';
        }
    }

    document.addEventListener('DOMContentLoaded', loadProductDetail);

    // Dynamic updates when the cart is altered elsewhere (e.g. cart dropdown)
    window.addEventListener('cartChanged', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const sku = urlParams.get('sku');
        if (sku) {
            updateCartStatus(sku);
        }
    });
</script>
