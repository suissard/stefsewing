<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Commande confirmée - Stef.Sewing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Nunito", sans-serif;
        background-color: #faedcb;
        background-image:
          radial-gradient(
            at 0% 0%,
            rgba(212, 163, 115, 0.15) 0px,
            transparent 50%
          ),
          radial-gradient(
            at 100% 0%,
            rgba(109, 138, 104, 0.15) 0px,
            transparent 50%
          );
        background-attachment: fixed;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      h1,
      h2,
      h3,
      .font-round {
        font-family: "Poppins", sans-serif;
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.6);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.8);
        box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.1);
      }
    </style>
  </head>
  <body
    class="text-gray-800 antialiased selection:bg-[#D4A373] selection:text-white flex flex-col items-center justify-center"
  >
    <main class="flex-grow flex items-center justify-center py-12 px-4 w-full">
      <div
        class="glass-card rounded-3xl p-10 sm:p-16 max-w-2xl w-full text-center relative overflow-hidden"
      >
        <!-- Decorative circle -->
        <div
          class="absolute -top-10 -right-10 w-32 h-32 bg-[#D4A373] opacity-20 rounded-full blur-2xl"
        ></div>
        <div
          class="absolute -bottom-10 -left-10 w-40 h-40 bg-[#6D8A68] opacity-20 rounded-full blur-2xl"
        ></div>

        <div
          class="w-24 h-24 bg-[#6D8A68] rounded-full flex items-center justify-center mx-auto mb-8 shadow-lg text-white"
        >
          <svg
            class="w-12 h-12"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="3"
              d="M5 13l4 4L19 7"
            ></path>
          </svg>
        </div>

        <h1 class="text-4xl font-bold text-gray-800 font-round mb-4">
          Merci pour votre commande !
        </h1>
        <p class="text-lg text-gray-600 mb-8 max-w-lg mx-auto">
          Votre paiement a bien été accepté. Nous préparons votre commande avec
          soin et amour. Vous recevrez un e-mail de confirmation très bientôt.
        </p>

        <div
          class="flex flex-col sm:flex-row items-center justify-center gap-4"
        >
          <a
            href="index.html"
            class="w-full sm:w-auto bg-[#D4A373] text-white font-bold py-3 px-8 rounded-full hover:bg-[#b88c61] transition shadow-md"
            >Retour à l'accueil</a
          >
          <a
            href="boutique.html"
            class="w-full sm:w-auto bg-white text-[#6D8A68] border-2 border-[#6D8A68] font-bold py-3 px-8 rounded-full hover:bg-[#F2F6F1] transition shadow-sm"
            >Continuer mes achats</a
          >
        </div>
      </div>
    </main>

    <script src="cart.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // Empty the cart on successful checkout confirmation
        localStorage.removeItem(CART_STORAGE_KEY);
        // We can also call updateCartUI to just ensure state is right if components were present
        if (typeof updateCartUI === "function") updateCartUI();
      });
    </script>
  </body>
</html>
