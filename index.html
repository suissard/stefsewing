<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stef.Sewing - Créations & Bijoux</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #fdf8f5;
            background-image: radial-gradient(circle at top left, #ffe4e6, transparent 40%),
                              radial-gradient(circle at bottom right, #e0f2fe, transparent 40%);
        }
        h1, h2, h3, h4, .font-round { font-family: 'Fredoka', sans-serif; }
        .hide { display: none; }
    </style>
</head>
<body class="text-gray-800 flex flex-col min-h-screen">

    <!-- En-tête -->
    <header class="sticky top-4 z-50 mx-4 sm:mx-8">
        <div class="bg-white/90 px-6 py-4 rounded-[2rem] flex justify-between items-center shadow-sm">
            <h1 class="text-2xl font-bold text-pink-500 m-0">Stef.Sewing</h1>
            <div class="flex items-center space-x-4">
                <a href="https://instagram.com/stef.sewing" target="_blank" class="text-gray-500 hover:text-pink-500">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
                </a>
                <button class="relative bg-pink-50 p-2 rounded-full text-pink-500 shadow-sm">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                    <span id="cart-count" class="absolute -top-1 -right-1 bg-blue-400 text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Héro -->
    <section class="pt-16 pb-10 px-4 text-center">
        <span class="bg-white text-pink-600 px-4 py-1.5 rounded-full text-sm font-bold mb-6 inline-block shadow-sm">✨ Fait main avec amour</span>
        <h2 class="text-4xl font-bold text-gray-800 mb-4">Sacs, Bananes <br><span class="text-pink-500">& Bijoux</span></h2>
        <p class="text-gray-600 mb-8 font-medium">Créations artisanales colorées. Trouvez la pièce unique !</p>
        <a href="#boutique" class="rounded-full bg-pink-500 text-white font-bold px-8 py-3 shadow-md hover:bg-pink-600 inline-block">
            Voir les créations 🛍️
        </a>
    </section>

    <!-- Boutique -->
    <section id="boutique" class="py-10 px-4 max-w-5xl mx-auto">
        <!-- Filtres -->
        <div class="flex flex-wrap justify-center gap-2 mb-8" id="filters">
            <button class="filter-btn active rounded-full px-5 py-2 text-sm font-bold bg-pink-500 text-white shadow-sm" data-filter="all">Tout</button>
            <button class="filter-btn rounded-full px-5 py-2 text-sm font-bold bg-white text-gray-600 shadow-sm" data-filter="couture">Couture 🧵</button>
            <button class="filter-btn rounded-full px-5 py-2 text-sm font-bold bg-white text-gray-600 shadow-sm" data-filter="bijoux">Bijoux ✨</button>
        </div>

        <!-- Grille -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6" id="product-grid">
            
            <div class="bg-white rounded-[2rem] p-3 shadow-sm" data-category="couture">
                <div class="h-48 mb-3 overflow-hidden rounded-[1.5rem] rounded-b-xl">
                    <img src="https://images.unsplash.com/photo-1544816155-12df9643f363?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80" alt="Banane" class="w-full h-full object-cover">
                </div>
                <div class="px-2 pb-2">
                    <span class="text-[10px] font-bold text-pink-500 uppercase bg-pink-50 px-2 py-0.5 rounded-full mb-1 inline-block">Couture</span>
                    <h4 class="text-lg font-bold text-gray-800 m-0">Banane "Savane"</h4>
                    <div class="flex justify-between items-center mt-3">
                        <span class="text-lg font-bold text-gray-800">45€</span>
                        <button onclick="addToCart('Banane Savane')" class="rounded-full bg-blue-100 text-blue-600 w-8 h-8 flex items-center justify-center font-bold hover:bg-blue-200">+</button>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-[2rem] p-3 shadow-sm" data-category="bijoux">
                <div class="h-48 mb-3 overflow-hidden rounded-[1.5rem] rounded-b-xl bg-gray-50">
                    <img src="https://images.unsplash.com/photo-1535632066927-ab7c9ab60908?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80" alt="Boucles" class="w-full h-full object-cover">
                </div>
                <div class="px-2 pb-2">
                    <span class="text-[10px] font-bold text-blue-500 uppercase bg-blue-50 px-2 py-0.5 rounded-full mb-1 inline-block">Bijoux</span>
                    <h4 class="text-lg font-bold text-gray-800 m-0">Boucles "Perles"</h4>
                    <div class="flex justify-between items-center mt-3">
                        <span class="text-lg font-bold text-gray-800">22€</span>
                        <button onclick="addToCart('Boucles Perles')" class="rounded-full bg-blue-100 text-blue-600 w-8 h-8 flex items-center justify-center font-bold hover:bg-blue-200">+</button>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-[2rem] p-3 shadow-sm" data-category="couture">
                <div class="h-48 mb-3 overflow-hidden rounded-[1.5rem] rounded-b-xl">
                    <img src="https://images.unsplash.com/photo-1591561954557-26941169b49e?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80" alt="Cabas" class="w-full h-full object-cover">
                </div>
                <div class="px-2 pb-2">
                    <span class="text-[10px] font-bold text-pink-500 uppercase bg-pink-50 px-2 py-0.5 rounded-full mb-1 inline-block">Couture</span>
                    <h4 class="text-lg font-bold text-gray-800 m-0">Cabas Fleuri</h4>
                    <div class="flex justify-between items-center mt-3">
                        <span class="text-lg font-bold text-gray-800">65€</span>
                        <button onclick="addToCart('Cabas Fleuri')" class="rounded-full bg-blue-100 text-blue-600 w-8 h-8 flex items-center justify-center font-bold hover:bg-blue-200">+</button>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-[2rem] p-3 shadow-sm" data-category="bijoux">
                <div class="h-48 mb-3 overflow-hidden rounded-[1.5rem] rounded-b-xl bg-gray-50">
                    <img src="https://images.unsplash.com/photo-1599643478514-4a4e0f152336?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80" alt="Collier" class="w-full h-full object-cover">
                </div>
                <div class="px-2 pb-2">
                    <span class="text-[10px] font-bold text-blue-500 uppercase bg-blue-50 px-2 py-0.5 rounded-full mb-1 inline-block">Bijoux</span>
                    <h4 class="text-lg font-bold text-gray-800 m-0">Collier "Soleil"</h4>
                    <div class="flex justify-between items-center mt-3">
                        <span class="text-lg font-bold text-gray-800">28€</span>
                        <button onclick="addToCart('Collier Soleil')" class="rounded-full bg-blue-100 text-blue-600 w-8 h-8 flex items-center justify-center font-bold hover:bg-blue-200">+</button>
                    </div>
                </div>
            </div>

        </div>
    </section>

    <!-- Footer -->
    <footer class="mt-auto bg-white rounded-t-[2rem] pt-8 pb-4 text-center shadow-sm">
        <h2 class="text-xl font-bold text-pink-500 mb-1">Stef.Sewing</h2>
        <p class="text-xs text-gray-500">&copy; 2026</p>
    </footer>

    <script>
        const filterBtns = document.querySelectorAll('.filter-btn');
        const products = document.querySelectorAll('#product-grid > div');

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => { b.className = 'filter-btn rounded-full px-5 py-2 text-sm font-bold bg-white text-gray-600 shadow-sm'; });
                btn.className = 'filter-btn active rounded-full px-5 py-2 text-sm font-bold bg-pink-500 text-white shadow-sm';
                
                const filterValue = btn.getAttribute('data-filter');
                products.forEach(product => {
                    if (filterValue === 'all' || product.getAttribute('data-category') === filterValue) {
                        product.style.display = 'block';
                    } else {
                        product.style.display = 'none';
                    }
                });
            });
        });

        let cartItemCount = 0;
        window.addToCart = function(productName) {
            const countEl = document.getElementById('cart-count');
            countEl.innerText = ++cartItemCount;
            
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-4 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-4 py-2 rounded-full shadow-lg z-50 text-sm font-bold';
            toast.innerHTML = `🛍️ Ajouté`;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 1000);
        };
    </script>
</body>
</html>
